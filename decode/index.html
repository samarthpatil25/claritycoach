/* ============ THEMES (pick with <html data-look="...">) ============ */
:root,[data-look=light]{--bg:#fff;--bg-alt:#F4F6FB;--surface:#fff;--ink:#0B1324;--muted:#556079;--line:#E3E7EF;
  --brand:#3355FF;--brand-ink:#fff;--hot:#F0443A;--star:#FFB020;--ok:#12A150;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:Figtree,system-ui,sans-serif;--h-weight:800;--h-track:-.035em}
[data-look=royal]{--bg:#fff;--bg-alt:#F8F4FC;--surface:#fff;--ink:#1E1130;--muted:#66597A;--line:#ECE4F3;
  --brand:#5B2A86;--brand-ink:#fff;--hot:#D9363E;--star:#D7A12A;--ok:#12A150;
  --f-display:Fraunces,Georgia,serif;--f-body:Figtree,system-ui,sans-serif;--h-weight:650;--h-track:-.02em}
[data-look=dark]{--bg:#080B14;--bg-alt:#0D1220;--surface:#121A2B;--ink:#EEF2FA;--muted:#9AA5BE;--line:rgb(255 255 255/.09);
  --brand:#F2B544;--brand-ink:#111;--hot:#FF5A4E;--star:#F2B544;--ok:#3DD68C;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:Figtree,system-ui,sans-serif;--h-weight:800;--h-track:-.035em}
[data-look=energy]{--bg:#fff;--bg-alt:#FFF8E1;--surface:#fff;--ink:#111111;--muted:#4D4D4D;--line:#EBE5D3;
  --brand:#FF5A1F;--brand-ink:#fff;--hot:#E11D48;--star:#FFB800;--ok:#16A34A;
  --f-display:Archivo,system-ui,sans-serif;--f-body:Figtree,system-ui,sans-serif;--h-weight:800;--h-track:-.03em}
/* Moreway v2 — matches moreway.in (dark, warm) */
[data-look=moreway]{--bg:#121216;--bg-alt:#17151A;--surface:rgb(255 255 255/.05);--ink:#F3EDE4;--muted:#A8A198;--line:rgb(255 255 255/.09);
  --brand:#F5B04F;--brand-ink:#1B1009;--hot:#F5B04F;--star:#F5B04F;--ok:#F5B04F;
  --amber:#F5B04F;--o1:#FF7A45;--o2:#FFB75E;
  --f-display:Fraunces,Georgia,serif;--f-body:Inter,system-ui,sans-serif;--h-weight:600;--h-track:-.02em}
:root{--brand-soft:color-mix(in srgb,var(--brand) 11%,var(--bg));--brand-line:color-mix(in srgb,var(--brand) 28%,var(--line));
  --hot-soft:color-mix(in srgb,var(--hot) 12%,var(--bg));--r-lg:28px;--r:20px;--r-sm:12px;
  --sh:0 1px 2px rgb(16 24 40/.05),0 12px 32px -12px rgb(16 24 40/.18);--sh-brand:0 14px 30px -10px color-mix(in srgb,var(--brand) 60%,transparent)}

/* ============ BASE ============ */
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1.04;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,4.7vw,62px)}
h2{font-size:clamp(30px,4vw,50px)}
h3{font-size:21px;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sec{padding:clamp(56px,7.5vw,96px) 0}
.alt{background:var(--bg-alt)}
.muted{color:var(--muted)}
.center{text-align:center}
.head{max-width:720px;margin:0 auto 44px;text-align:center}
.head p{margin-top:14px;font-size:19px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;margin-bottom:18px}
[data-look=dark] .tag{color:var(--brand)}
.ph{outline:2px dashed #F5A524;background:rgb(245 165 36/.14);border-radius:6px;padding:0 .3em}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ BUTTON ============ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:0 30px;border-radius:16px;
  background:var(--brand);color:var(--brand-ink);font:800 18px/1 var(--f-body);text-decoration:none;box-shadow:var(--sh-brand),inset 0 1px 0 rgb(255 255 255/.25);
  transition:transform .2s ease,box-shadow .2s ease;overflow:hidden;isolation:isolate}
.btn:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgb(255 255 255/.35) 50%,transparent 65%);transform:translateX(-120%)}
.btn:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.btn:after{animation:shine 3.2s ease-in-out infinite}}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn small{font-weight:600;opacity:.85;font-size:15px}
.btn.full{width:100%}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.micro{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:14px;color:var(--muted)}
.micro span{display:inline-flex;align-items:center;gap:6px}
.micro svg{width:16px;height:16px;color:var(--ok)}

/* ============ URGENCY BAR ============ */
.topbar{background:var(--ink);color:var(--bg);font-size:14.5px;font-weight:600}
[data-look=dark] .topbar{background:var(--hot);color:#fff}
.topbar .wrap{display:flex;align-items:center;justify-content:center;gap:10px 18px;flex-wrap:wrap;min-height:46px;padding-top:8px;padding-bottom:8px;text-align:center}
.topbar b{font-variant-numeric:tabular-nums;background:var(--hot);color:#fff;padding:3px 9px;border-radius:7px;letter-spacing:.02em}
[data-look=dark] .topbar b{background:rgb(0 0 0/.25)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 0 var(--hot);flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:ping 1.8s infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* ============ NAV ============ */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:800 20px var(--f-display);letter-spacing:-.02em;text-decoration:none}
.logo img{height:34px;width:auto}
.nav .btn{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.nav .seats-mini{font-size:14px;color:var(--muted);margin-right:14px}
.nav .seats-mini b{color:var(--hot)}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:clamp(28px,4vw,52px) 0 clamp(52px,7vw,84px)}
.hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:70vw;height:70vw;max-width:900px;max-height:900px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 22%,transparent),transparent);pointer-events:none}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 30% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 30% 0%,#000 30%,transparent 75%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center}
.live{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);padding:8px 14px 8px 12px;border-radius:999px;font-size:14.5px;font-weight:700}
.hero h1{margin:18px 0 14px}
.hl{position:relative;white-space:nowrap;color:var(--brand)}
.hl svg{position:absolute;left:0;bottom:-.14em;width:100%;height:.3em;fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;opacity:.45}
.sub{font-size:clamp(18px,1.6vw,21px);color:var(--muted);max-width:56ch}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.facts div{padding:12px 14px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.facts small svg{width:15px;height:15px;color:var(--brand)}
.facts b{display:block;font-size:15.5px;margin-top:2px;line-height:1.3}
.pricebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.price{font:var(--h-weight) clamp(38px,4vw,48px)/1 var(--f-display);letter-spacing:-.03em}
.mrp{font-size:20px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px}
.off{background:var(--hot-soft);color:var(--hot);font-weight:800;font-size:14px;padding:6px 10px;border-radius:8px}
.cta-row{display:flex;flex-direction:column;align-items:flex-start;max-width:460px}
.cta-row .btn{width:100%}
.proof{display:flex;align-items:center;gap:14px;margin-top:20px}
.avs{display:flex}
.avs span{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--bg);margin-left:-10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:var(--brand);overflow:hidden}
.avs span:first-child{margin-left:0}
.avs img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.proof p{font-size:14.5px;line-height:1.35}
.proof b{font-weight:800}

.visual{position:relative;justify-self:center;width:min(100%,470px)}
.portrait{position:relative;aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(120% 80% at 50% 100%,color-mix(in srgb,var(--brand) 85%,#000) 0%,var(--brand) 45%,color-mix(in srgb,var(--brand) 55%,#fff) 100%);box-shadow:0 40px 80px -30px color-mix(in srgb,var(--brand) 55%,transparent)}
[data-look=dark] .portrait{background:radial-gradient(120% 80% at 50% 100%,#2a2108 0%,#6b4d12 50%,#c08a2a 100%)}
.portrait:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 110%,rgb(255 255 255/.10) 0 1px,transparent 1px 34px)}
.portrait img.cut{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94%;width:auto;max-width:none;filter:drop-shadow(0 20px 30px rgb(0 0 0/.35))}
.portrait img.photo{width:100%;height:100%;object-fit:cover;object-position:var(--fp,50% 25%)}
.nameplate{position:absolute;left:14px;right:14px;bottom:14px;background:rgb(255 255 255/.88);backdrop-filter:blur(10px);color:#0B1324;border-radius:16px;padding:12px 16px}
[data-look=dark] .nameplate{background:rgb(10 14 24/.78);color:#EEF2FA}
.nameplate b{display:block;font:800 17px var(--f-display)}
.nameplate span{font-size:13.5px;opacity:.75}
.chip{position:absolute;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 18px 40px -16px rgb(16 24 40/.35);font-size:13.5px;line-height:1.25}
.chip strong{display:block;font:800 18px var(--f-display);letter-spacing:-.02em}
.chip .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.chip.c1{top:9%;left:-34px}.chip.c2{top:44%;right:-30px}
@media (prefers-reduced-motion:no-preference){.chip{animation:float 6s ease-in-out infinite}.chip.c2{animation-delay:-3s}}
@keyframes float{50%{transform:translateY(-8px)}}

/* ============ SEATS BAR ============ */
.seats{margin-top:22px;max-width:460px}
.seats-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}
.seats-top em{font-style:normal;color:var(--hot)}
.bar{height:10px;background:var(--bg-alt);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--hot));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}

/* ============ STRIP ============ */
.strip{border-block:1px solid var(--line);background:var(--surface)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:26px 20px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:var(--h-weight) clamp(28px,3vw,40px)/1 var(--f-display);letter-spacing:-.03em}
.stat span{font-size:14.5px;color:var(--muted)}
.logos{display:flex;align-items:center;justify-content:center;gap:18px 44px;flex-wrap:wrap;padding:26px 0;color:var(--muted);font-weight:700}
.logos img{height:28px;width:auto;filter:grayscale(1);opacity:.65}

/* ============ PAIN ============ */
.pain{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.pain-list{display:grid;gap:12px}
.pain-list div{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;font-weight:600}
.pain-list svg{color:var(--hot);margin-top:3px}
.callout{margin-top:22px;padding:18px 20px;border-radius:var(--r-sm);background:var(--brand-soft);border:1px solid var(--brand-line);font-weight:600}

/* ============ LEARN ============ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.learn .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:18px}
.learn .ic svg{width:24px;height:24px}
.learn p{color:var(--muted);margin-top:8px;font-size:16px}
.agenda{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.day .when{display:inline-block;background:var(--brand);color:var(--brand-ink);font:800 13px var(--f-body);padding:5px 10px;border-radius:8px;margin-bottom:12px}
.day ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;color:var(--muted)}
.day li{display:flex;gap:10px}.day li svg{color:var(--ok);width:18px;height:18px;margin-top:4px}

/* ============ FIT ============ */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fit ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.fit li{display:flex;gap:12px;align-items:flex-start}
.fit .yes svg{color:var(--ok)}.fit .no svg{color:var(--hot)}
.fit .no{background:transparent;box-shadow:none}

/* ============ TESTIMONIALS ============ */
.wall{columns:3 300px;column-gap:20px}
.wall>*{break-inside:avoid;margin-bottom:20px}
.quote p{font-size:16.5px}
.quote .who{display:flex;align-items:center;gap:12px;margin-top:18px}
.quote .who span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--brand-ink);background:var(--brand);overflow:hidden;flex:none}
.quote .who img{width:100%;height:100%;object-fit:cover}
.quote .who b{display:block;font-size:15px}.quote .who small{color:var(--muted)}
.result{display:inline-block;margin-bottom:12px;background:color-mix(in srgb,var(--ok) 13%,var(--bg));color:var(--ok);font-weight:800;font-size:13.5px;padding:5px 10px;border-radius:8px}
.shot{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);background:#fff}

/* ============ CTA BAND / COUNTDOWN ============ */
.band{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:clamp(32px,5vw,56px);display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;position:relative;overflow:hidden}
[data-look=dark] .band{background:linear-gradient(135deg,#1a2236,#0f1525);color:var(--ink);border:1px solid var(--line)}
.band:before{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 55%,transparent),transparent)}
.band p{opacity:.75;margin-top:12px}
.band>*{position:relative}
.cd{display:flex;gap:10px}
.cd div{flex:1;min-width:64px;text-align:center;background:rgb(255 255 255/.08);border:1px solid rgb(255 255 255/.14);border-radius:14px;padding:12px 6px}
.cd b{display:block;font:800 clamp(26px,3vw,34px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd small{font-size:12px;opacity:.7}
.light-cd .cd div{background:var(--bg-alt);border-color:var(--line)}
.cd-label{font-weight:700;font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}

/* ============ HOST ============ */
.host{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center}
.host .portrait{max-width:440px}
.creds{display:grid;gap:10px;margin:22px 0}
.creds div{display:flex;gap:12px}.creds svg{color:var(--brand);margin-top:3px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hstats div{background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}
.hstats b{display:block;font:var(--h-weight) 28px/1 var(--f-display);letter-spacing:-.03em}
.hstats span{font-size:13.5px;color:var(--muted)}

/* ============ BONUSES ============ */
.bonus{position:relative;border:1.5px dashed var(--brand-line);background:var(--surface);border-radius:var(--r);padding:26px}
.bonus .bn{display:inline-block;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:13px;padding:5px 10px;border-radius:8px;margin-bottom:14px}
.bonus p{color:var(--muted);margin-top:8px;font-size:16px}
.bonus .worth{margin-top:16px;font-weight:700}
.bonus .worth s{color:var(--muted);text-decoration-color:var(--hot)}
.bonus .worth em{font-style:normal;color:var(--ok);margin-left:6px}
.expire{margin:28px auto 0;max-width:720px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--hot-soft);color:var(--hot);border-radius:var(--r-sm);padding:14px 18px;font-weight:700;text-align:center}

/* ============ OFFER ============ */
.offer{display:grid;grid-template-columns:1.1fr .9fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 30px 70px -30px rgb(16 24 40/.3);overflow:hidden;max-width:1000px;margin:0 auto}
.stack{padding:clamp(24px,4vw,44px)}
.stack ul{list-style:none;margin:22px 0 0;padding:0}
.stack li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.stack li span{display:flex;gap:10px}.stack li svg{color:var(--ok);margin-top:3px}
.stack li s{color:var(--muted);white-space:nowrap}
.stack .total{display:flex;justify-content:space-between;padding-top:16px;font-weight:800}
.stack .total s{color:var(--hot)}
.pay{background:var(--brand-soft);padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.pay .label{font-weight:700;color:var(--muted);font-size:15px}
.pay .price{font-size:clamp(52px,6vw,68px);margin:6px 0 4px}
.pay .save{font-weight:800;color:var(--hot);margin-bottom:18px}
.pay .light-cd{margin:18px 0}
.methods{font-size:13.5px;color:var(--muted);margin-top:12px;text-align:center}
.guar{display:flex;gap:18px;align-items:center;max-width:820px;margin:36px auto 0;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.seal{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;text-align:center;font:800 12.5px/1.15 var(--f-body);color:var(--brand-ink);background:var(--brand);box-shadow:0 0 0 6px var(--brand-soft)}

/* ============ PACKS ============ */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1000px;margin:0 auto}
.pack{position:relative;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pack.best{border:2px solid var(--brand);box-shadow:0 30px 60px -30px color-mix(in srgb,var(--brand) 60%,transparent)}
.pack .badge{position:absolute;top:-14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px}
.pack .price{font-size:40px;margin-top:8px}.pack .btn{margin-top:14px;width:100%;min-height:54px;font-size:16px}

/* ============ FAQ ============ */
.faq{max-width:820px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px 0;cursor:pointer;list-style:none;font-weight:700;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg-alt);display:grid;place-items:center;font-style:normal;transition:transform .25s}
.faq details[open] summary i{transform:rotate(45deg);background:var(--brand);color:var(--brand-ink)}
.faq details p{padding:0 0 22px;color:var(--muted)}

/* ============ FINAL ============ */
.final{text-align:center}
.final .cd{max-width:420px;margin:26px auto}
.final .btn{min-width:min(100%,420px)}
.final .micro{justify-content:center}
footer{border-top:1px solid var(--line);padding:36px 0;font-size:14px;color:var(--muted)}
footer .row{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer .legal{margin-top:18px;font-size:12.5px;line-height:1.55}

/* ============ STICKY + POPUP + TOAST ============ */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -10px 30px -12px rgb(16 24 40/.25);transform:translateY(110%);transition:transform .35s ease}
.sticky.show{transform:none}
.sticky .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sticky .p{line-height:1.2}
.sticky .p b{font:var(--h-weight) 24px var(--f-display)}
.sticky .p s{color:var(--muted);font-size:14px;margin-left:4px}
.sticky .p small{display:block;color:var(--hot);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.sticky .btn{min-height:52px;padding:0 22px;font-size:16px}
.pop{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgb(8 11 20/.6);padding:20px}
.pop.show{display:grid}
.pop .card{max-width:440px;text-align:center;position:relative;padding:34px 28px}
.pop .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}
.pop h3{font-size:26px;margin:8px 0}
.pop .light-cd{margin:20px 0}

/* ============ REVEAL ============ */
.js .reveal{transform:translateY(16px);transition:transform .7s ease}
.js .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .reveal{opacity:1;transform:none}}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
  .hero .wrap,.pain,.host,.band,.offer{grid-template-columns:1fr}
  .hero .wrap{gap:36px}
  .visual{width:min(100%,380px)}
  .chip.c1{left:-8px}.chip.c2{right:-8px}
  .grid3{grid-template-columns:1fr 1fr}
  .pay{border-left:0;border-top:1px solid var(--line)}
  .host .portrait{margin:0 auto;width:100%}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .nav .seats-mini{display:none}
  .nav .wrap{height:58px}.nav .btn{min-height:40px;padding:0 14px}
  .facts b{font-size:15px}
  .facts{grid-template-columns:1fr 1fr}
  .facts div:nth-child(3){border-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--line)}
  .strip .wrap{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
  .grid3,.fit{grid-template-columns:1fr}
  .hstats b{font-size:22px}
  .chip{font-size:12px;padding:8px 10px}.chip strong{font-size:15px}.chip .ic{width:30px;height:30px}
  .portrait{max-height:56vh;margin:0 auto}
  .visual{width:min(100%,330px)}
  .guar{flex-direction:column;text-align:center}
  .cd div{min-width:0}
}

/* ================================================================
   MOREWAY LOOK v2 — matches moreway.in: warm near-black everywhere, cream serif,
   orange→amber gradient pills, glass surfaces, quiet motion. No white backgrounds.
   ================================================================ */
[data-look=moreway]{color-scheme:dark}
[data-look=moreway] body{font-size:16px;line-height:1.55;background:var(--bg);overflow-x:clip}
[data-look=moreway] .wrap{max-width:1100px;padding:0 24px}
[data-look=moreway] h1{font-size:clamp(31px,4.3vw,54px);line-height:1.1;color:var(--ink)}
[data-look=moreway] h2{font-size:clamp(28px,3.4vw,44px);line-height:1.14;color:var(--ink)}
[data-look=moreway] h3{font-size:20px;color:var(--ink)}
[data-look=moreway] .sec{position:relative;padding:clamp(60px,7.5vw,100px) 0}
[data-look=moreway] .alt{background:var(--bg-alt)}
[data-look=moreway] .muted{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgb(245 176 79/.35);background:rgb(245 176 79/.06);border-radius:999px;padding:7px 14px;margin-bottom:18px}
.grad{background:linear-gradient(100deg,var(--o1),var(--o2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ambient glow behind everything, so the glass has something to refract */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.ambient i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#5a3420}
.ambient i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:30vh;background:#3b2417}
.ambient i:nth-child(3){width:30vw;height:30vw;left:30vw;bottom:-14vw;background:#4a2a1a;opacity:.35}
@media (prefers-reduced-motion:no-preference){
  .ambient i{animation:drift 26s ease-in-out infinite alternate}
  .ambient i:nth-child(2){animation-duration:32s;animation-delay:-8s}
  .ambient i:nth-child(3){animation-duration:38s;animation-delay:-14s}
}
@keyframes drift{to{transform:translate3d(6vw,5vh,0) scale(1.12)}}

/* glass */
.glass,[data-look=moreway] .card{background:linear-gradient(160deg,rgb(255 255 255/.075),rgb(255 255 255/.025));border:1px solid rgb(255 255 255/.09);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgb(255 255 255/.08),0 24px 60px -30px rgb(0 0 0/.7);border-radius:20px}

/* CTA: warm gradient pill, glow, shine, arrow nudge, ripple + "opening" state on click */
[data-look=moreway] .btn{background:linear-gradient(110deg,var(--o1) 0%,#FF9450 45%,var(--o2) 100%);background-size:160% 100%;color:#1B1009;
  min-height:56px;border-radius:999px;padding:0 30px;font:600 17px/1.1 var(--f-body);letter-spacing:.005em;text-align:center;
  box-shadow:0 0 0 1px rgb(255 190 120/.35) inset,0 14px 34px -10px rgb(255 122 69/.65),0 2px 0 rgb(255 255 255/.35) inset;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background-position .5s}
[data-look=moreway] .btn:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 0 0 1px rgb(255 190 120/.5) inset,0 20px 44px -10px rgb(255 122 69/.85),0 2px 0 rgb(255 255 255/.35) inset}
[data-look=moreway] .btn:active{transform:scale(.97)}
[data-look=moreway] .btn .arr{display:inline-block;transition:transform .25s}
[data-look=moreway] .btn:hover .arr{transform:translateX(4px)}
@media (prefers-reduced-motion:no-preference){[data-look=moreway] .btn .arr{animation:nudge 2.4s ease-in-out infinite}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}90%{transform:translateX(0)}}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgb(255 255 255/.55);pointer-events:none;animation:rip .65s ease-out forwards}
@keyframes rip{to{transform:scale(4);opacity:0}}
.btn.loading{pointer-events:none}
.btn.loading .lbl{opacity:0}
.btn .busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px}
.btn.loading .busy{display:flex}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgb(27 16 9/.25);border-top-color:#1B1009;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;color:var(--ink);text-decoration:none;font:600 15.5px/1 var(--f-body);
  background:rgb(255 255 255/.04);border:1px solid rgb(255 255 255/.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .25s,background .25s,transform .25s}
.btn-ghost:hover{border-color:rgb(37 211 102/.6);background:rgb(37 211 102/.08);transform:translateY(-1px)}
.btn-ghost svg{width:18px;height:18px;fill:#25D366}

/* top bar + nav */
[data-look=moreway] .topbar{background:#0B0B0E;color:var(--muted);font-size:13px;font-weight:500;border-bottom:1px solid rgb(255 255 255/.06)}
[data-look=moreway] .topbar .wrap{min-height:36px;padding-top:6px;padding-bottom:6px;gap:8px;flex-wrap:nowrap}

@media (prefers-reduced-motion:no-preference){[data-look=moreway] .dot{animation:breath 2.6s ease-in-out infinite}}
@keyframes breath{50%{box-shadow:0 0 0 6px rgb(245 176 79/0);opacity:.55}0%,100%{box-shadow:0 0 0 0 rgb(245 176 79/.5)}}
[data-look=moreway] .nav{position:sticky;top:0;background:rgb(14 14 18/.72);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgb(255 255 255/.06)}
[data-look=moreway] .logo{color:var(--ink);font-weight:600;font-size:21px}
[data-look=moreway] .nav .btn{min-height:44px;font-size:15px;padding:0 20px}
.navlinks{display:flex;gap:28px;font-size:15px;color:var(--muted)}
.navlinks a{text-decoration:none;transition:color .2s}.navlinks a:hover{color:var(--ink)}

/* hero */
[data-look=moreway] .hero{background:radial-gradient(70% 60% at 30% 0%,rgb(110 62 34/.45),transparent 70%),radial-gradient(50% 50% at 90% 40%,rgb(70 40 26/.35),transparent 70%);padding:clamp(30px,5vw,64px) 0 clamp(56px,7vw,90px)}
[data-look=moreway] .hero:before,[data-look=moreway] .hero:after{display:none}
[data-look=moreway] .hero .wrap{grid-template-columns:55fr 45fr;gap:52px}
[data-look=moreway] .hero h1{margin:6px 0 18px}
.hero h1 .ln{display:inline}
@media (prefers-reduced-motion:no-preference){.hero h1{opacity:0;transform:translateY(14px);animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) forwards}.hero .sub,.hero .cta-row,.hero .facts{opacity:0;animation:rise .9s .45s cubic-bezier(.2,.8,.2,1) forwards}
  .hero .visual{opacity:0;animation:rise 1.1s .25s cubic-bezier(.2,.8,.2,1) forwards}}
@keyframes rise{to{opacity:1;transform:none}}
[data-look=moreway] .sub{color:var(--muted);font-size:17.5px;max-width:52ch}
[data-look=moreway] .sub b{color:var(--ink);font-weight:600}
[data-look=moreway] .facts{display:flex;flex-wrap:wrap;gap:8px;background:none;border:0;box-shadow:none;border-radius:0;margin:22px 0 0;overflow:visible}
[data-look=moreway] .facts div{border:1px solid rgb(255 255 255/.12);background:rgb(255 255 255/.04);border-radius:999px;padding:6px 13px}
[data-look=moreway] .facts small{display:none}
[data-look=moreway] .facts b{font-size:13.5px;font-weight:600;margin:0;color:var(--ink)}
[data-look=moreway] .cta-row{max-width:none;margin-top:24px;gap:12px;flex-direction:row;flex-wrap:wrap;align-items:center}
[data-look=moreway] .cta-row .btn{width:auto}
.hero-micro{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:13px;color:var(--muted)}
.hero-micro span{display:inline-flex;align-items:center;gap:6px}
.hero-micro svg{width:15px;height:15px;color:var(--amber)}
.tb-short{display:none}
.hero-quote{margin-top:22px;padding-left:14px;border-left:2px solid rgb(245 176 79/.5);font-family:var(--f-display);font-style:italic;color:var(--ink);font-size:17px;max-width:44ch}
.hero-quote small{display:block;font:400 12.5px var(--f-body);font-style:normal;color:var(--muted);margin-top:4px}
/* hero photo: glass frame with a slowly turning warm edge */
.frame{position:relative;border-radius:26px;padding:1.5px;background:conic-gradient(from var(--ang,0deg),rgb(255 122 69/.0),rgb(255 183 94/.75),rgb(255 122 69/.0) 40%,rgb(255 255 255/.12) 70%,rgb(255 122 69/.0))}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@media (prefers-reduced-motion:no-preference){.frame{animation:turn 9s linear infinite}}
@keyframes turn{to{--ang:360deg}}
[data-look=moreway] .portrait{border-radius:25px;background:radial-gradient(90% 70% at 50% 100%,#3a2416,#1b1513 70%);box-shadow:0 40px 90px -40px rgb(0 0 0/.9)}
[data-look=moreway] .portrait:before{display:none}
[data-look=moreway] .portrait .phbox{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13.5px;padding:24px;color:var(--ink)}
[data-look=moreway] .nameplate{display:flex;align-items:center;gap:12px;left:14px;right:auto;bottom:14px;background:rgb(18 16 18/.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border:1px solid rgb(255 255 255/.12);border-radius:16px;padding:10px 16px 10px 12px}
[data-look=moreway] .nameplate b{font:600 16px var(--f-display);display:block}
[data-look=moreway] .nameplate span{font-size:12.5px;opacity:1;color:var(--amber)}
.nameplate .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--o1),var(--o2));display:grid;place-items:center;color:#1B1009;font:700 14px var(--f-body)}
.float-chip{position:absolute;top:18px;right:-16px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font-size:13px;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.float-chip{animation:float 6s ease-in-out infinite}}

/* why */
.narrow{max-width:700px!important}
.why h2{margin-bottom:28px}
.lines p{font-size:18px;margin:0 0 14px;color:var(--muted)}
.lines p:first-child{color:var(--ink)}
.lines p.strong{font-family:var(--f-display);font-size:24px;line-height:1.3;color:var(--ink);margin-top:26px}
.loop{margin:30px auto 8px;max-width:540px;padding:18px 10px 10px}

.loop text{font-family:var(--f-display);font-size:17px;fill:var(--ink)}
.loop .again{font-family:var(--f-body);font-style:italic;font-size:15px;fill:var(--amber)}
.loop .ring{stroke:url(#lg);stroke-width:2;fill:none}
.loop .gap{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:4 7}
.loop .node{fill:#2a1d15;stroke:var(--amber);stroke-width:2}
.loop .runner{fill:var(--o2);filter:drop-shadow(0 0 6px rgb(255 183 94/.9))}
@media (prefers-reduced-motion:no-preference){
  .loop .gap{animation:dash 1.4s linear infinite}

  .loop .node:nth-of-type(4){animation-delay:3s}.loop .node:nth-of-type(5){animation-delay:4s}.loop .node:nth-of-type(6){animation-delay:5s}

.loop figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
.dots{list-style:none;margin:16px 0 30px;padding:0;display:grid;gap:12px}

.dots li:before{content:"";flex:none;width:14px;height:14px;margin-top:4px;border-radius:50%;border:2px solid var(--amber);background:radial-gradient(circle,var(--amber) 0 2.5px,transparent 3px)}
.why h3{font-size:23px;margin-top:34px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.cta-solo{display:flex;flex-direction:column;align-items:flex-start}

[data-look=moreway] .quote .ctx{display:block;margin-top:14px;font-size:12.5px;color:var(--amber)}
.qmark{font:600 54px/0.6 var(--f-display);color:var(--amber);opacity:.55;display:block;height:24px}
.proof-sub{color:var(--muted);margin-top:12px;font-size:17px}

.host-bio p{margin:0 0 14px;font-size:17px;color:var(--muted)}
.host-bio p:first-child{color:var(--ink)}
.host-bio p.sign{font-family:var(--f-display);font-size:22px;color:var(--amber);margin-top:20px}
.titles{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

[data-look=moreway] .pay{border-left:0;background:radial-gradient(120% 90% at 100% 0%,rgb(255 122 69/.18),transparent 60%),linear-gradient(160deg,rgb(255 255 255/.08),rgb(255 255 255/.03));border:1px solid rgb(255 183 94/.25)}
[data-look=moreway] .pay .label{color:var(--muted);font-weight:500}
[data-look=moreway] .pay .price{font-size:clamp(58px,6vw,74px);margin:4px 0 6px}
[data-look=moreway] .pay .save{color:var(--muted);font-weight:400;font-size:15px;font-style:italic;margin-bottom:22px}
[data-look=moreway] .pay .btn{width:100%;font-size:16px;padding:0 18px}
[data-look=moreway] .methods{color:var(--muted)}
.scarce{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid rgb(255 255 255/.08)}
.scarce svg{width:16px;height:16px;color:var(--amber);margin-top:2px}
.addons{max-width:940px;margin:44px auto 0}
.addons h3{text-align:center}
.addons .note{text-align:center;margin:6px 0 20px}
.addon-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

  <div class="fit"><div class="card yes reveal"><h3>You’ll feel at home here if</h3><ul id="yes"></ul></div><div class="card no reveal"><h3>This won’t work if</h3><ul id="no"></ul></div></div>
  <div class="center reveal" style="margin-top:34px"><a class="btn cta cta-price" href="#"></a></div>
</div></section>

<section class="sec" id="faq-sec"><div class="wrap">
  <div class="head reveal"><h2 data-l="faq"></h2></div>
  <div class="faq reveal" id="faq"></div>
</div></section>

<section class="sec close"><div class="wrap">
  <span class="eyebrow reveal" id="close-eyebrow"></span>
  <h2 id="close-title" class="reveal"></h2>
  <div class="paths reveal" id="paths"></div>
  <p class="future reveal" id="future"></p>
  <a class="btn cta cta-price" href="#"></a>
  <p class="note" id="close-micro"></p>
</div></section>
</main>

<footer><div class="wrap"><div class="row"><span id="f-company"></span><nav id="f-links"></nav></div><p class="legal" id="f-legal"></p></div></footer>

<div class="dock" id="dock">
  <div class="info"><b>Decode Call · 25 min</b><small id="dock-sub"></small></div>
  <a class="btn cta" href="#" id="dock-btn"></a>
</div>
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="pop-title"><div class="card"><button class="x" aria-label="Close">×</button><span class="eyebrow">Before you go</span><h3 id="pop-title"></h3><p class="muted" id="pop-sub" style="margin:8px 0 22px"></p><a class="btn full cta cta-price" href="#"></a><br><button class="nothanks" id="nothanks">No thanks</button></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wa-logo" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
  <symbol id="i-rupee" viewBox="0 0 24 24"><path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3a5 5 0 0 0 0-10"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4"/></symbol>
  <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 7 10 10S7 17 7 22M17 2c0 5-10 7-10 10s10 5 10 10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>

<script>
(()=>{
const C=CONFIG, d=document, $=s=>d.querySelector(s), $$=s=>[...d.querySelectorAll(s)];
d.documentElement.classList.add('js');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const set=(s,h)=>{const e=$(s); if(e) e.innerHTML=h};
const hide=(s,cond)=>{const e=$(s); if(e&&cond) e.style.display='none'};
const track=(ev,p)=>{try{if(window.fbq)fbq('track',ev,p||{})}catch(e){}};
const label=t=>`<span class="lbl">${t} <span class="arr">→</span></span><span class="busy"><span class="spin"></span>Opening secure checkout…</span>`;

/* text */
$$('.cta-price').forEach(a=>a.innerHTML=label(`${C.ctaText} · ${C.price}`));
set('#nav-btn',label(`Book · ${C.price}`)); set('#dock-btn',label(`${C.dockText} · ${C.price}`)); set('#dock-sub',C.floatChip);
$$('.p-price').forEach(e=>e.textContent=C.price);
set('#logo',C.logo?`<img src="${C.logo}" alt="${C.brandName}">`:C.brandName);
set('#tb-text',C.topbar); set('#badge',C.eventBadge);
set('#h1',C.headline.map(l=>`<span class="ln">${l}</span>`).join(' '));
set('#sub',C.subheadline);
set('#facts',C.facts.map(f=>`<div><b>${f}</b></div>`).join(''));
set('#hero-micro',C.heroMicro.map(m=>`<span>${ic(m[0])}${m[1]}</span>`).join(''));
set('#hero-quote',`“${C.heroQuote[0]}”<small>${C.heroQuote[1]}</small>`);
const portrait=(h,note)=>h.photo?`<img class="photo" src="${h.photo}" alt="${h.name}, Mindset Consultant" style="--fp:${h.focus||'50% 25%'}">`:`<div class="phbox"><span class="ph">${note}</span></div>`;
set('#hero-portrait',portrait(C.host,C.heroPhotoNote)+`<div class="nameplate"><span class="av">T</span><div><b>${C.host.name}</b><span>${C.host.role}</span></div></div>`);
set('#float-chip',`<span class="dot"></span>${C.floatChip}`);
set('#host-portrait',portrait({...C.host,photo:C.story.photo||'',focus:'38% 50%'},C.story.photoNote));

set('#why-eyebrow',C.why.eyebrow); set('#why-title',C.why.title);
set('#why-lines',C.why.lines.map(l=>`<p>${l}</p>`).join('')+`<p class="strong">${C.why.turn}</p>`);
set('#why-after',C.why.after.map(l=>`<p>${l}</p>`).join(''));
set('#why-list-title',C.why.listTitle); set('#why-list',C.why.list.map(x=>`<li>${x}</li>`).join('')); set('#why-micro',C.why.micro);

set('#stats',C.stats.map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join(''));
set('#cost-eyebrow',C.cost.eyebrow); set('#cost-title',C.cost.title); set('#cost-sub',C.cost.sub);
set('#cost-grid',C.cost.items.map(c=>`<div class="cost-card reveal"><div class="ci">${ic(c[0])}</div><h4>${c[1]}</h4><p>${c[2]}</p></div>`).join(''));
set('#cost-math',C.cost.math); set('#cost-close',C.cost.close);
set('#how-eyebrow',C.how.eyebrow); set('#how-title',C.how.title);
set('#steps',C.how.steps.map(x=>`<div class="step glass reveal"><span class="when">${x[0]}</span><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join(''));
set('#ex-title',C.how.exTitle); set('#ex-note',C.how.exNote);
set('#chain',C.how.ex.map(x=>`<div class="link"><small>${x[0]}</small><span>${x[1]}</span></div>`).join(''));
set('#ex-loop',C.how.exLoop); set('#ex-next',C.how.exNext);
set('#proof-eyebrow',C.proofEyebrow); set('#proof-title',C.proofTitle); set('#proof-sub',C.proofSub);
set('#wall',C.testimonials.map(t=>t.image?`<figure class="shot reveal" style="margin:0 0 20px"><img src="${t.image}" alt="${t.alt||'Client message'}" loading="lazy"></figure>`:
  `<div class="card quote reveal"><span class="qmark">“</span><p>${t.quote}</p>${t.ctx?`<span class="ctx">${t.ctx}</span>`:''}</div>`).join(''));

set('#story-eyebrow',C.story.eyebrow); set('#host-name',C.story.title);
set('#titles',C.story.titles.map(t=>`<span>${t}</span>`).join(''));
set('#host-bio',C.story.paras.map(p=>`<p>${p}</p>`).join('')+`<p class="sign">${C.story.sign}</p>`);

set('#offer-eyebrow',C.offerEyebrow); set('#offer-title',C.offerTitle);
set('#stack',C.stack.map(s=>`<li><span>${ic('check')}${s}</span></li>`).join(''));
set('#save',C.reframe); set('#methods',C.payMethods); set('#scarce',C.scarcity);
set('#addons-title',C.addonsTitle); set('#addons-note',C.addonsNote);
set('#addons',C.addons.map(a=>`<div class="addon glass"><span class="box" aria-hidden="true"></span><div><h4>${a[0]}</h4><p>${a[1]}</p><div class="ap">${a[2]?`<s>${a[2]}</s>`:''}<em>Add for ${a[3]}</em></div></div></div>`).join(''));
hide('#addons-wrap',!C.addons.length);
set('#guar-title',C.guarantee[0]); set('#guar-text',C.guarantee[1]);

$$('[data-l]').forEach(e=>e.textContent=C.labels[e.dataset.l]||'');
set('#yes',C.forYou.map(x=>`<li>${ic('check')}${x}</li>`).join('')); set('#no',C.notForYou.map(x=>`<li>${ic('minus')}${x}</li>`).join(''));
set('#faq',C.faqs.map((f,i)=>`<details${i?'':' open'}><summary>${f[0]}<i>+</i></summary><p>${f[1]}</p></details>`).join(''));
set('#close-eyebrow',C.closeEyebrow); set('#close-title',C.closeTitle);
set('#paths',C.paths.map((p,i)=>`<div class="path p${i+1}${i?' glass':''}"><b>Path ${i+1}</b>${p}</div>`).join(''));
set('#future',C.future); set('#close-micro',C.closeMicro);
set('#f-company',`© ${new Date().getFullYear()} ${C.footer.company}${C.footer.contact?' · '+C.footer.contact:''}`);
set('#f-links',C.footer.links.map(l=>`<a href="${l[1]}">${l[0]}</a>`).join('')); set('#f-legal',C.footer.disclaimer);
set('#pop-title',C.popup.title); set('#pop-sub',C.popup.sub);

/* WhatsApp */
const waUrl=`https://wa.me/${C.whatsapp.number}?text=${encodeURIComponent(C.whatsapp.message)}`;
$$('.wa-link').forEach(a=>{a.href=waUrl;a.addEventListener('click',()=>track('Contact'))});

/* booking buttons: ripple where tapped, press, then "Opening secure checkout…" and go */
$$('.cta').forEach(a=>{a.href=C.ctaUrl;a.addEventListener('click',e=>{
  track('InitiateCheckout',{value:299,currency:'INR'});
  track('Lead',{value:299,currency:'INR'});
  const r=a.getBoundingClientRect(),s=Math.max(r.width,r.height),rp=d.createElement('span');
  rp.className='ripple';rp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;a.appendChild(rp);setTimeout(()=>rp.remove(),700);
  if(!/^https?:/.test(C.ctaUrl)) return;            // placeholder link: just the ripple
  e.preventDefault(); a.classList.add('loading');
  setTimeout(()=>{location.href=C.ctaUrl},reduce?0:550);
  setTimeout(()=>a.classList.remove('loading'),4000);
})});
addEventListener('pageshow',()=>$$('.cta.loading').forEach(a=>a.classList.remove('loading')));

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target)}),{threshold:.12});
$$('.reveal').forEach(e=>io.observe(e));

/* floating dock: appears after the hero button scrolls away, hides while an FAQ answer is being read */
const heroCta=$('.hero .cta-price'), dock=$('#dock'), faqSec=$('#faq-sec');
const heroObs=new IntersectionObserver(([e])=>dock.classList.toggle('show',!e.isIntersecting&&e.boundingClientRect.top<0)); heroObs.observe(heroCta);
const faqCheck=()=>{const r=faqSec.getBoundingClientRect();const open=$$('#faq details[open]').length>0;dock.classList.toggle('faqopen',open&&r.top<innerHeight*.6&&r.bottom>innerHeight*.4)};
$$('#faq details').forEach(x=>x.addEventListener('toggle',faqCheck));

/* ViewContent at 50% scroll; popup: exit intent on desktop, 45s or 60% scroll on mobile, once per visit */
let vc=false; const pop=$('#pop');
let seen=false; try{seen=sessionStorage.getItem('mw_pop')==='1'}catch(e){}
const openPop=()=>{if(seen||!C.exitPopup)return;seen=true;try{sessionStorage.setItem('mw_pop','1')}catch(e){};pop.classList.add('show')};
addEventListener('scroll',()=>{const pct=(scrollY+innerHeight)/d.body.scrollHeight;faqCheck();
  if(!vc&&pct>.5){vc=true;track('ViewContent',{content_name:'Decode Call'})}
  if(innerWidth<=900&&pct>.6)openPop()},{passive:true});
if(innerWidth<=900) setTimeout(openPop,45000);
d.addEventListener('mouseout',e=>{if(!e.relatedTarget&&e.clientY<8&&innerWidth>900)openPop()});
const closePop=()=>pop.classList.remove('show');
pop.addEventListener('click',e=>{if(e.target===pop||e.target.closest('.x')||e.target.id==='nothanks')closePop()});
d.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
if(reduce){const r=$('#runner');if(r)r.remove()}
})();
</script>
</body>
</html>
